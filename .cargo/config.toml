[alias]
xtask = "run --quiet --package xtask --"

# The fork already assumes AVX2 (`check_cpu_features`). Setting the baseline to
# x86-64-v3 lets the compiler emit AVX2, BMI1/2 and FMA throughout — most useful
# for the submission-prep thread's dword comparisons, slot scans and hashing.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
